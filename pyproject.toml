[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cartesia-voice-agent"
version = "0.1.0"
description = "Open-source Cartesia + Claude + Notion MCP voice agent scaffold"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.35.0",
  "aiortc>=1.5.0",
  "cartesia>=2.0.0",
  "flask>=3.0.0",
  "httpx>=0.27.0",
  "mcp>=1.1.0",
  "pandas>=2.0.0",
  "psycopg2-binary",
  "SQLAlchemy>=2.0.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.0",
]

[project.scripts]
voice-agent = "voice_agent.cli:main"
voice-agent-server = "voice_agent.server:main"

[tool.setuptools.packages.find]
where = ["src"]
