<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Dashboard - Convonet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .login-card {
            max-width: 400px;
            margin: 100px auto;
        }
        
        .team-selector {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .todo-item, .calendar-item {
            border-left: 4px solid #007bff;
            padding: 10px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 0 8px 8px 0;
        }
        
        .calendar-item {
            border-left-color: #28a745;
        }
        
        .team-member {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #e9ecef;
        }
        
        .team-member:last-child {
            border-bottom: none;
        }
        
        .member-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 10px;
        }
        
        .status-badge {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 20px;
        }
        
        .status-online {
            background: #d4edda;
            color: #155724;
        }
        
        .status-offline {
            background: #f8d7da;
            color: #721c24;
        }
        
        .chat-message {
            padding: 10px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .chat-message.own {
            background: #007bff;
            color: white;
            margin-left: 20%;
        }
        
        .token-display {
            font-family: monospace;
            font-size: 11px;
            word-break: break-all;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Login Section -->
        <div id="loginSection" class="login-card">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">🔐 Team Dashboard Login</h4>
                </div>
                <div class="card-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                    <div id="loginError" class="alert alert-danger mt-3 d-none"></div>
                </div>
            </div>
        </div>
        
        <!-- Main Dashboard -->
        <div id="dashboardSection" style="display: none;">
            <!-- Header -->
            <div class="card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <h2 class="mb-0">👥 Team Dashboard</h2>
                    <div>
                        <span id="currentUser" class="me-3"></span>
                        <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
                    </div>
                </div>
            </div>
            
            <!-- Team Selector -->
            <div class="team-selector">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <select id="teamSelect" class="form-select" onchange="changeTeam()">
                            <option value="">Select a team...</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <button class="btn btn-success me-2" onclick="showCreateTeamModal()">+ Create Team</button>
                        <button class="btn btn-primary" onclick="showAddMemberModal()">+ Add Member</button>
                    </div>
                </div>
            </div>
            
            <!-- Dashboard Content -->
            <div class="row">
                <!-- Team Members -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header bg-info text-white">
                            <h5 class="mb-0">👥 Team Members</h5>
                        </div>
                        <div class="card-body" id="teamMembers">
                            <!-- Members will be loaded here -->
                        </div>
                    </div>
                    
                    <!-- Team Chat -->
                    <div class="card">
                        <div class="card-header bg-secondary text-white">
                            <h5 class="mb-0">💬 Team Chat</h5>
                        </div>
                        <div class="card-body" style="height: 300px; overflow-y: auto;" id="chatMessages">
                            <!-- Chat messages -->
                        </div>
                        <div class="card-footer">
                            <div class="input-group">
                                <input type="text" class="form-control" id="chatInput" placeholder="Type message...">
                                <button class="btn btn-primary" onclick="sendChatMessage()">Send</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Todo List -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header bg-warning text-dark">
                            <h5 class="mb-0">📝 Team Tasks</h5>
                        </div>
                        <div class="card-body">
                            <div class="input-group mb-3">
                                <input type="text" class="form-control" id="newTask" placeholder="Add new task...">
                                <button class="btn btn-warning" onclick="addTask()">Add</button>
                            </div>
                            <div id="todoList">
                                <!-- Tasks will be loaded here -->
                            </div>
                        </div>
                    </div>
                    
                    <!-- Calendar Events -->
                    <div class="card">
                        <div class="card-header bg-success text-white">
                            <h5 class="mb-0">📅 Upcoming Events</h5>
                        </div>
                        <div class="card-body" id="calendarEvents">
                            <!-- Events will be loaded here -->
                        </div>
                    </div>
                </div>
                
                <!-- API Status & Tokens -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header bg-dark text-white">
                            <h5 class="mb-0">🔧 API Status</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <h6>Connection Status</h6>
                                <span id="apiStatus" class="badge bg-secondary">Checking...</span>
                            </div>
                            <div class="mb-3">
                                <h6>Authentication Token</h6>
                                <div id="tokenDisplay" class="token-display">Not logged in</div>
                            </div>
                            <div class="mb-3">
                                <h6>Refresh Token</h6>
                                <div id="refreshTokenDisplay" class="token-display">Not available</div>
                            </div>
                            <button class="btn btn-outline-primary btn-sm" onclick="refreshToken()">Refresh Token</button>
                        </div>
                    </div>
                    
                    <!-- Quick Actions -->
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">⚡ Quick Actions</h5>
                        </div>
                        <div class="card-body">
                            <button class="btn btn-primary w-100 mb-2" onclick="syncWithCalendar()">Sync Calendar</button>
                            <button class="btn btn-info w-100 mb-2" onclick="loadTeamAnalytics()">View Analytics</button>
                            <button class="btn btn-warning w-100" onclick="exportTeamData()">Export Data</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Create Team Modal -->
    <div class="modal fade" id="createTeamModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Team</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" class="form-control" id="teamName" placeholder="Team name">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="createTeam()">Create</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Add Member Modal -->
    <div class="modal fade" id="addMemberModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Team Member</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="email" class="form-control mb-2" id="memberEmail" placeholder="Email address">
                    <input type="text" class="form-control" id="memberRole" placeholder="Role (optional)">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addMember()">Add Member</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let authToken = null;
        let refreshToken = null;
        let currentTeamId = null;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            checkApiStatus();
            
            // Login form handler
            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                await login();
            });
        });
        
        async function checkApiStatus() {
            try {
                const response = await fetch('/api/health');
                if (response.ok) {
                    document.getElementById('apiStatus').textContent = 'Online';
                    document.getElementById('apiStatus').className = 'badge bg-success';
                }
            } catch {
                document.getElementById('apiStatus').textContent = 'Offline';
                document.getElementById('apiStatus').className = 'badge bg-danger';
            }
        }
        
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    authToken = data.access_token;
                    refreshToken = data.refresh_token;
                    document.getElementById('tokenDisplay').textContent = authToken;
                    document.getElementById('refreshTokenDisplay').textContent = refreshToken;
                    document.getElementById('currentUser').textContent = `Welcome, ${username}`;
                    
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('dashboardSection').style.display = 'block';
                    
                    await loadTeams();
                } else {
                    showLoginError(data.message || 'Login failed');
                }
            } catch (error) {
                showLoginError('Connection error');
            }
        }
        
        function showLoginError(message) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = message;
            errorDiv.classList.remove('d-none');
        }
        
        function logout() {
            authToken = null;
            refreshToken = null;
            currentTeamId = null;
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('dashboardSection').style.display = 'none';
        }
        
        async function loadTeams() {
            try {
                const response = await fetch('/api/teams', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await response.json();
                
                const select = document.getElementById('teamSelect');
                select.innerHTML = '<option value="">Select a team...</option>';
                
                data.teams.forEach(team => {
                    const option = document.createElement('option');
                    option.value = team.id;
                    option.textContent = team.name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading teams:', error);
            }
        }
        
        async function changeTeam() {
            currentTeamId = document.getElementById('teamSelect').value;
            if (currentTeamId) {
                await loadTeamMembers();
                await loadTasks();
                await loadEvents();
            }
        }
        
        async function loadTeamMembers() {
            try {
                const response = await fetch(`/api/teams/${currentTeamId}/members`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await response.json();
                
                const container = document.getElementById('teamMembers');
                container.innerHTML = data.members.map(member => `
                    <div class="team-member">
                        <div class="member-avatar">${member.name[0].toUpperCase()}</div>
                        <div>
                            <div>${member.name}</div>
                            <small class="text-muted">${member.role || 'Member'}</small>
                        </div>
                        <span class="status-badge status-${member.status} ms-auto">${member.status}</span>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading members:', error);
            }
        }
        
        async function loadTasks() {
            try {
                const response = await fetch(`/api/teams/${currentTeamId}/tasks`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await response.json();
                
                const container = document.getElementById('todoList');
                container.innerHTML = data.tasks.map(task => `
                    <div class="todo-item">
                        <div><strong>${task.title}</strong></div>
                        <small class="text-muted">${task.assigned_to || 'Unassigned'} • ${task.due_date || 'No due date'}</small>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading tasks:', error);
            }
        }
        
        async function loadEvents() {
            try {
                const response = await fetch(`/api/teams/${currentTeamId}/events`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await response.json();
                
                const container = document.getElementById('calendarEvents');
                container.innerHTML = data.events.map(event => `
                    <div class="calendar-item">
                        <div><strong>${event.title}</strong></div>
                        <small class="text-muted">${event.date} • ${event.time}</small>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading events:', error);
            }
        }
        
        async function addTask() {
            const taskTitle = document.getElementById('newTask').value;
            if (!taskTitle || !currentTeamId) return;
            
            try {
                await fetch(`/api/teams/${currentTeamId}/tasks`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title: taskTitle })
                });
                
                document.getElementById('newTask').value = '';
                await loadTasks();
            } catch (error) {
                console.error('Error adding task:', error);
            }
        }
        
        function showCreateTeamModal() {
            new bootstrap.Modal(document.getElementById('createTeamModal')).show();
        }
        
        function showAddMemberModal() {
            new bootstrap.Modal(document.getElementById('addMemberModal')).show();
        }
        
        async function createTeam() {
            const name = document.getElementById('teamName').value;
            if (!name) return;
            
            try {
                await fetch('/api/teams', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name })
                });
                
                bootstrap.Modal.getInstance(document.getElementById('createTeamModal')).hide();
                await loadTeams();
            } catch (error) {
                console.error('Error creating team:', error);
            }
        }
        
        async function addMember() {
            const email = document.getElementById('memberEmail').value;
            const role = document.getElementById('memberRole').value;
            if (!email || !currentTeamId) return;
            
            try {
                await fetch(`/api/teams/${currentTeamId}/members`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, role })
                });
                
                bootstrap.Modal.getInstance(document.getElementById('addMemberModal')).hide();
                await loadTeamMembers();
            } catch (error) {
                console.error('Error adding member:', error);
            }
        }
        
        async function refreshToken() {
            try {
                const response = await fetch('/api/auth/refresh', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${refreshToken}` }
                });
                const data = await response.json();
                if (data.success) {
                    authToken = data.access_token;
                    document.getElementById('tokenDisplay').textContent = authToken;
                }
            } catch (error) {
                console.error('Error refreshing token:', error);
            }
        }
        
        function sendChatMessage() {
            const message = document.getElementById('chatInput').value;
            if (!message) return;
            
            const chatContainer = document.getElementById('chatMessages');
            chatContainer.innerHTML += `
                <div class="chat-message own">
                    <div>${message}</div>
                    <small>${new Date().toLocaleTimeString()}</small>
                </div>
            `;
            
            document.getElementById('chatInput').value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        // Placeholder functions for quick actions
        function syncWithCalendar() {
            alert('Calendar sync initiated');
        }
        
        function loadTeamAnalytics() {
            alert('Loading analytics...');
        }
        
        function exportTeamData() {
            alert('Exporting team data...');
        }
    </script>
</body>
</html>
